name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    env:
      # Continue the AppVeyor numbering (last published: 1.0.122)
      PACKAGE_VERSION_OFFSET: 122
    steps:
      - uses: actions/checkout@v4

      - name: Compute package version
        shell: pwsh
        run: |
          $version = "1.0.$([int]$env:GITHUB_RUN_NUMBER + [int]$env:PACKAGE_VERSION_OFFSET)"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Package version: $version"

      - name: Run tests
        shell: pwsh
        run: .\run_tests.ps1

      - name: Build NuGet package
        shell: pwsh
        run: .\build_nuget.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NugetPackages
          path: Output/*.nupkg

      - name: NuGet login (OIDC → temporary API key)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: dotnet nuget push "Output\*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
