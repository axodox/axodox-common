#Every branch builds a package: main's goes to nuget.org, the others' (1.0.<build>-<branch>, prereleases) only to the
#AppVeyor account's NuGet feed, through the project feed which collects the build's .nupkg artifacts, for using
#unfinished versions internally
version: 1.0.{build}
image: Visual Studio 2022
build_script:
- ps: .\build_nuget.ps1
artifacts:
- path: Output\*.nupkg
  name: NugetPackages
deploy:
- provider: NuGet
  api_key:
    secure: y+7WZBzkjiCwo2zv0W+oQNGJ6sh10RdrirYgmnL9azcgk7n9Wmodjohy0IUKg1PT
  username:
    secure: 1K8aMtHh4cgJD51abewigQ==
  artifact: NugetPackages
  on:
    branch: main